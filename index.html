<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharkie Game Dashboard</title>

  <!-- 💡 关键：加入这 4 行，专门解决 Canva 报错的问题 -->
  <meta property="og:title" content="Sharkie Game Dashboard">
  <meta property="og:description" content="Interactive HP, Coins and Water Skill Tracker for Canva Lessons">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://via.placeholder.com/300x200/0d2b45/ffffff?text=Sharkie+Game">

  <style>
    body {
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      background: #0d2b45;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .game-card {
      background: #203c56;
      border: 4px solid #4fb3bf;
      border-radius: 16px;
      padding: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .drop-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }
    .drop-slot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px dashed #4fb3bf;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      opacity: 0.3;
    }
    .drop-slot.filled {
      background: #00d2ff;
      border-style: solid;
      box-shadow: 0 0 10px #00d2ff;
      opacity: 1;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }
    .btn-correct { background: #4caf50; color: white; }
    .btn-wrong { background: #f44336; color: white; }
    .btn-skill {
      background: #ff9800;
      color: white;
      width: 100%;
      margin-top: 10px;
      display: none;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="game-card">
  <div class="status-row">
    <div>❤️ HP: <span id="hp">❤️❤️❤️❤️❤️</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
  </div>

  <div style="font-size: 14px; color: #a5d6a7;">Water Skill Charge:</div>
  <div class="drop-bar">
    <div class="drop-slot" id="drop1">💧</div>
    <div class="drop-slot" id="drop2">💧</div>
    <div class="drop-slot" id="drop3">💧</div>
  </div>

  <button id="skillBtn" class="btn-skill" onclick="useSkill()">🌊 WATER SPLASH! (Double Damage)</button>

  <div class="btn-group">
    <button class="btn-correct" onclick="answer(true)">✅ Correct (+Coins)</button>
    <button class="btn-wrong" onclick="answer(false)">❌ Wrong (-Heart)</button>
  </div>
</div>

<script>
  let hp = 5;
  let coins = 0;
  let drops = 0;

  function updateUI() {
    document.getElementById('hp').innerText = '❤️'.repeat(hp) || '☠️ Game Over';
    document.getElementById('coins').innerText = coins;
    
    for(let i = 1; i <= 3; i++) {
      let slot = document.getElementById('drop' + i);
      if(i <= drops) {
        slot.classList.add('filled');
      } else {
        slot.classList.remove('filled');
      }
    }

    if(drops >= 3) {
      document.getElementById('skillBtn').style.display = 'block';
    } else {
      document.getElementById('skillBtn').style.display = 'none';
    }
  }

  function answer(isCorrect) {
    if (isCorrect) {
      coins += 10;
      if (drops < 3) drops += 1;
    } else {
      if (hp > 0) hp -= 1;
    }
    updateUI();
  }

  function useSkill() {
    alert("🌊 WATER SPLASH ACTIVATED! Pirate took double damage!");
    drops = 0;
    coins += 20;
    updateUI();
  }

  updateUI();
</script>

</body>
</html>
