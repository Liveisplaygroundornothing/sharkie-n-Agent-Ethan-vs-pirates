<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sharkie Game Dashboard</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      background: #0d2b45;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .game-card {
      background: #203c56;
      border: 4px solid #4fb3bf;
      border-radius: 16px;
      padding: 20px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      position: relative;
    }
    /* Boss 血条样式 */
    .boss-box {
      background: #111a2e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #ff5252;
    }
    .hp-bar-bg {
      background: #444;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 5px;
    }
    .hp-bar-fill {
      background: #ff5252;
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
    }
    .drop-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
    }
    .drop-slot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px dashed #4fb3bf;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.3;
    }
    .drop-slot.filled {
      background: #00d2ff;
      border-style: solid;
      box-shadow: 0 0 10px #00d2ff;
      opacity: 1;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-correct { background: #4caf50; color: white; }
    .btn-wrong { background: #f44336; color: white; }
    .btn-skill {
      background: linear-gradient(45deg, #ff9800, #ff5722);
      color: white;
      width: 100%;
      margin-top: 8px;
      display: none;
      font-size: 16px;
      animation: pulse 0.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    /* 暴击震动效果 */
    .shake {
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<div class="game-card" id="card">
  <div class="boss-box">
    <div style="display:flex; justify-content:space-between; font-size: 14px;">
      <span>👾 Octo Boss</span>
      <span id="bossHpText">100 / 100 HP</span>
    </div>
    <div class="hp-bar-bg">
      <div class="hp-bar-fill" id="bossBar"></div>
    </div>
  </div>

  <div class="status-row">
    <div>❤️ HP: <span id="hp">❤️❤️❤️❤️❤️</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
  </div>

  <div style="font-size: 12px; color: #a5d6a7;">Water Skill Charge:</div>
  <div class="drop-bar">
    <div class="drop-slot" id="drop1">💧</div>
    <div class="drop-slot" id="drop2">💧</div>
    <div class="drop-slot" id="drop3">💧</div>
  </div>

  <button id="skillBtn" class="btn-skill" onclick="useSkill()">🌊 WATER SPLASH! (-30 HP)</button>

  <div class="btn-group">
    <button class="btn-correct" onclick="answer(true)">✅ Correct (+Coins)</button>
    <button class="btn-wrong" onclick="answer(false)">❌ Wrong (-Heart)</button>
  </div>
</div>

<script>
  let hp = 5;
  let coins = 0;
  let drops = 0;
  let bossHp = 100;

  function updateUI() {
    document.getElementById('hp').innerText = '❤️'.repeat(hp) || '☠️ Game Over';
    document.getElementById('coins').innerText = coins;
    
    // 更新 Boss 血条
    let bossPercent = Math.max(0, bossHp);
    document.getElementById('bossBar').style.width = bossPercent + '%';
    document.getElementById('bossHpText').innerText = bossPercent + ' / 100 HP';

    for(let i = 1; i <= 3; i++) {
      let slot = document.getElementById('drop' + i);
      slot.classList.toggle('filled', i <= drops);
    }

    document.getElementById('skillBtn').style.display = drops >= 3 ? 'block' : 'none';
  }

  function answer(isCorrect) {
    if (isCorrect) {
      coins += 10;
      if (drops < 3) drops += 1;
      // 答对给 Boss 造成 10 点基础伤害
      bossHp = Math.max(0, bossHp - 10);
    } else {
      if (hp > 0) hp -= 1;
    }
    updateUI();
  }

  function useSkill() {
    // 双倍/暴击伤害：扣 30 HP
    bossHp = Math.max(0, bossHp - 30);
    drops = 0;
    coins += 20;

    // 触发震屏特效
    let card = document.getElementById('card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 300);

    updateUI();
    if (bossHp <= 0) {
      setTimeout(() => alert("🎉 VICTORY! Octo Boss was defeated!"), 100);
    }
  }

  updateUI();
</script>

</body>
</html>
